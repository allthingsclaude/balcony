name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test BalconyShared
        run: cd BalconyShared && swift test

      - name: Build BalconyMac
        run: |
          xcodebuild \
            -project Balcony.xcodeproj \
            -scheme BalconyMac \
            -configuration Debug \
            build

      - name: Build BalconyiOS
        run: |
          xcodebuild \
            -project Balcony.xcodeproj \
            -scheme BalconyiOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            build
